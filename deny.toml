[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # humantime (unmaintained, not a vulnerability) arrives only via the cucumber dev-dependency.
  # Revisit when cucumber drops it. Added 2026-11-24.
  { id = "RUSTSEC-2026-0542", reason = "dev-only via cucumber; unmaintained, no known vulnerability" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
