[package]
name = "logis-core"
description = "Source state, target state and apply engine for logis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Ignore and remove patterns, with doublestar semantics (`*` stays in one path component).
globset = { version = "0.4.22", default-features = false }
# The process umask (`system::process_umask`), without unsafe code.
rustix = { version = "1.1.6", features = ["fs", "process"] }
# Atomic writes in `RealSystem`: a temporary file or symlink renamed into place.
tempfile = "3.27.0"

[dev-dependencies]
proptest = "1.12.0"
